<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميزان">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ميزان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: formal single-theme navy app. Home = centred title + «الدخول»; the button opens the sections grid; each section is its own view (hash-routed) with a header row (back button right, title centre), an optional month bar, then editable lists and totals. RTL. */
:root {
  --bg: #0b1d3a;
  --bg-deep: #07142a;
  --panel: #10274b;
  --panel-2: #0d2142;
  --ink: #f2f5fa;
  --muted: #a9b6cc;
  --line: #24406b;
  --gold: #c9a55a;
  --gold-soft: rgba(201, 165, 90, .18);
  --ok: #5cc29a;
  --warn: #e3b552;
  --bad: #e58272;
  --font-display: "Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; direction: rtl; text-align: right; }
.enter svg { transform: scaleX(-1); }
body { background: radial-gradient(120% 80% at 50% 0%, var(--bg) 0%, var(--bg-deep) 100%) fixed, var(--bg-deep); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.7; }
.wrap { min-height: 100%; max-width: 760px; margin: 0 auto; padding-block: 28px 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }

/* Home */
.wrap > main { flex: 1; display: grid; }
.home { display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center; text-align: center; }
.home .title { align-self: end; padding-bottom: 48px; }
.home .enter { grid-row: 2; }
.title { display: grid; justify-items: center; gap: 14px; }
.rule { display: flex; align-items: center; gap: 12px; width: min(280px, 70vw); color: var(--gold); }
.rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: var(--gold); opacity: .7; }
.rule i { width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); }
.home h1 { font-size: clamp(2.8rem, 13vw, 5rem); font-weight: 700; line-height: 1.25; color: var(--ink); letter-spacing: .01em; }
.enter { display: inline-flex; align-items: center; gap: 12px; border: 1px solid var(--gold); background: var(--gold); color: var(--bg-deep); cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; padding: 12px 32px; border-radius: 6px; box-shadow: 0 0 0 6px var(--gold-soft); }
.enter svg { width: 24px; height: 24px; }
.quote { position: relative; overflow: hidden; height: 3.1rem; margin: 0 0 22px; border-block: 1px solid var(--gold); background: var(--gold-soft); border-radius: 4px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.quote p { position: absolute; top: 0; left: 0; right: auto; margin: 0; height: 100%; display: flex; align-items: center; white-space: nowrap; color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; will-change: transform; transform: translateX(-100%); }
.gate, .pin-form { display: contents; }
.gate > p { grid-row: 2; }
.home .enter { grid-row: 2; }
.pin-box { display: grid; justify-items: center; gap: 10px; }
.home > .gate > .pin-form > .pin-box, .pin-below { grid-row: 3; align-self: start; margin-top: 26px; display: grid; justify-items: center; gap: 12px; }
.reg-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--gold); background: transparent; color: var(--gold); border-radius: 6px; padding: 8px 18px; cursor: pointer; font-family: var(--font-display); }
.reg-btn svg { width: 18px; height: 18px; }
.gate-title { font-size: 1.15rem; color: var(--gold); font-weight: 500; }
.gate-hint { margin: -6px 0 0; color: var(--muted); font-size: .85rem; }
.pin-pair { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.pin-field { display: grid; justify-items: center; gap: 4px; }
.pin-field label { font-family: var(--font-display); color: var(--muted); font-size: .9rem; }
.pin-input { width: 170px; text-align: center; letter-spacing: .4em; font-size: 1.3rem; padding: 10px; border-color: var(--gold); }
.pin-msg { margin: 0; min-height: 1.4em; font-size: .9rem; text-align: center; }
.pin-msg.err { color: var(--bad); } .pin-msg.ok { color: var(--ok); }
.enter.small { font-size: 1rem; padding: 8px 22px; box-shadow: none; }
.pin-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.lockbtn { justify-self: end; border: 1px solid var(--line); background: var(--panel); color: var(--gold); border-radius: 6px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; text-decoration: none; }
.lockbtn svg { width: 18px; height: 18px; }
@media (max-width: 420px) { .inside-head.has-lock { grid-template-columns: auto 1fr auto; } }

.ayah { margin: 6px 0 0; max-width: 30ch; font-family: "Amiri", "Noto Naskh Arabic", serif; font-size: clamp(1.15rem, 4.6vw, 1.45rem); line-height: 2; color: var(--gold); text-wrap: balance; }
.ayah span { display: block; font-size: .7em; color: var(--muted); line-height: 1.6; }
@media (prefers-reduced-motion: no-preference) {
  .enter { transition: background .2s ease, color .2s ease; }
  .enter:hover { background: transparent; color: var(--gold); }
}

/* Views */
.inside { display: grid; gap: 18px; align-content: start; }
.inside-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.inside-head .back { justify-self: start; }
.inside-head h2 { text-align: center; font-size: 1.5rem; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.back svg { width: 18px; height: 18px; }
@media (max-width: 420px) { .inside-head { grid-template-columns: auto 1fr; } .inside-head h2 { text-align: center; font-size: 1.2rem; } }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.grid > :last-child:nth-child(odd) { grid-column: 1 / -1; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 6px; min-width: 0; justify-items: center; text-align: center; text-decoration: none; color: inherit; }
a.tile { cursor: pointer; }
a.tile:hover { border-color: var(--gold); }
.tile h3 { font-weight: 500; font-size: 1.1rem; color: var(--gold); }
.tile .fig { font-family: var(--font-display); font-size: 1rem; color: var(--ink); }
.tag { font-size: .8rem; color: var(--muted); }

.monthbar { display: flex; align-items: center; justify-content: center; gap: 8px; }
.monthbar strong { font-family: var(--font-display); font-weight: 500; min-width: 150px; text-align: center; }
.monthbar button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; width: 36px; height: 36px; cursor: pointer; display: grid; place-items: center; }
.monthbar svg { width: 18px; height: 18px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card h3 { font-size: 1rem; font-weight: 500; color: var(--gold); }
.hint { margin: 0; color: var(--muted); font-size: .9rem; text-align: center; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 32px; gap: 8px; align-items: center; }
.row .lbl { min-width: 0; overflow-wrap: anywhere; }
.row .sub { display: block; color: var(--muted); font-size: .8rem; }
input, select { width: 100%; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
input.amt { text-align: left; direction: ltr; font-variant-numeric: tabular-nums; }
.x { border: 0; background: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; width: 32px; height: 32px; border-radius: 6px; }
.x:hover { color: var(--bad); background: var(--panel-2); }
.add { justify-self: start; border: 1px dashed var(--gold); background: none; color: var(--gold); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
.total { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; font-family: var(--font-display); }
.total b { color: var(--gold); font-weight: 700; }
.subform { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.subform label { display: grid; gap: 2px; font-size: .8rem; color: var(--muted); min-width: 0; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; background: var(--panel-2); }
.item input, .item select { background: var(--panel); }
.item-head { display: grid; grid-template-columns: minmax(0, 1fr) 32px; gap: 8px; align-items: center; }
.row.grip-on { grid-template-columns: 28px minmax(0, 1fr) 110px 32px; }
.item-head.grip-on { grid-template-columns: 28px minmax(0, 1fr) 32px; }
.grip { width: 28px; height: 40px; border: 0; background: none; color: var(--gold); cursor: grab; touch-action: none; display: grid; place-items: center; padding: 0; border-radius: 6px; -webkit-user-select: none; user-select: none; }
.grip svg { width: 18px; height: 18px; }
.rows > .dragging { position: relative; z-index: 5; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); outline: 1px solid var(--gold); border-radius: 8px; background: var(--panel-2); }
body.drag-active { -webkit-user-select: none; user-select: none; cursor: grabbing; }
.alerts { display: grid; gap: 8px; }
.alert { display: block; border: 1px solid var(--gold); background: var(--gold-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; text-decoration: none; text-align: center; font-size: .95rem; }
.alert-wrap { position: relative; }
.alert-wrap .alert { padding-inline: 40px; }
.alert-x { position: absolute; top: 50%; left: 4px; transform: translateY(-50%); }
.sec-row { grid-template-columns: minmax(0, 1fr) auto; align-items: end; }
.sec-label { display: grid; gap: 4px; font-size: .8rem; color: var(--gold); }
.sec-label input { border-color: var(--gold); }
.add.danger { color: var(--bad); border-color: var(--bad); }
.restore { display: grid; gap: 8px; justify-items: center; }
.copy-prev { display: grid; justify-items: center; gap: 6px; }
.period { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.period label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.toggles button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: .9rem; }
.toggles button i { width: 10px; height: 10px; border-radius: 50%; opacity: .35; }
.toggles button[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); }
.toggles button[aria-pressed="true"] i { opacity: 1; }
.picker { border: 1px solid var(--gold); border-radius: 8px; background: var(--panel-2); }
.picker summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; cursor: pointer; }
.picker summary::-webkit-details-marker { display: none; }
.picker summary::after { content: ""; width: 8px; height: 8px; border-left: 2px solid var(--gold); border-bottom: 2px solid var(--gold); transform: rotate(-45deg); margin-top: -4px; }
.picker[open] summary::after { transform: rotate(135deg); margin-top: 4px; }
.picker summary span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker summary small { color: var(--muted); }
.pick-list { display: grid; border-top: 1px solid var(--line); }
.pick { display: grid; grid-template-columns: 22px 12px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.pick:last-child { border-bottom: 0; }
.pick input { width: 20px; height: 20px; accent-color: var(--gold); margin: 0; }
.pick i { width: 12px; height: 12px; border-radius: 50%; }
.pick:first-child span { color: var(--gold); }
.legend-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: .85rem; color: var(--muted); }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.legend-row i { width: 10px; height: 10px; border-radius: 50%; }
.seg { display: flex; justify-content: center; gap: 0; }
.seg button { border: 1px solid var(--gold); background: transparent; color: var(--gold); padding: 6px 18px; cursor: pointer; font: inherit; }
.seg button:first-child { border-radius: 0 6px 6px 0; } .seg button:last-child { border-radius: 6px 0 0 6px; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--bg-deep); }
.chart-box { position: relative; }
.chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-box text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart-box .grid-l { stroke: var(--line); stroke-width: 1; }
.chart-box .base-l { stroke: var(--muted); stroke-width: 1; opacity: .6; }
.chart-box .guide { stroke: var(--gold); stroke-width: 1; stroke-dasharray: 3 3; }
.tip { position: absolute; top: 4px; z-index: 3; background: var(--bg-deep); border: 1px solid var(--gold); border-radius: 8px; padding: 8px 10px; font-size: .82rem; min-width: 150px; pointer-events: none; box-shadow: 0 6px 16px rgba(0, 0, 0, .4); }
.tip b { display: block; color: var(--gold); margin-bottom: 4px; }
.tip div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.tip i { width: 10px; height: 10px; border-radius: 50%; }
.ctable-wrap { overflow-x: auto; }
.ctable { width: 100%; border-collapse: collapse; font-size: .85rem; white-space: nowrap; }
.ctable th, .ctable td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: center; }
.ctable th { color: var(--gold); font-weight: 500; }
.ctable tfoot td { color: var(--ink); font-weight: 700; }
.ctable td:first-child, .ctable th:first-child { text-align: right; }
.item-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: .85rem; color: var(--muted); }

.track { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.item .track { background: var(--panel); }
.fill { height: 100%; background: var(--ok); border-radius: 99px; }
.fill.warn { background: var(--warn); }
.fill.bad { background: var(--bad); }
.chip { display: inline-block; font-size: .75rem; border-radius: 4px; padding: 0 8px; border: 1px solid currentColor; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.item-foot.pos { color: var(--ok); } .item-foot.neg { color: var(--bad); }

.cmp { display: grid; gap: 4px; padding-block: 8px; border-top: 1px solid var(--line); }
.cmp:first-child { border-top: 0; }
.cmp-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.cmp-nums { color: var(--muted); font-size: .85rem; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kpi { background: var(--panel); padding: 12px; display: grid; gap: 2px; text-align: center; min-width: 0; }
.kpi span { color: var(--muted); font-size: .8rem; }
.kpi b { font-family: var(--font-display); font-size: 1.1rem; overflow-wrap: anywhere; }
@media (max-width: 480px) { .kpis { grid-template-columns: 1fr 1fr; } .kpis .kpi:last-child { grid-column: 1 / -1; } }
.stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--panel-2); }
.stack i { display: block; height: 100%; }
.legend { display: grid; gap: 6px; }
.legend div { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: .9rem; }
.legend i { width: 12px; height: 12px; border-radius: 3px; }
.legend .pct { color: var(--muted); min-width: 3.5em; text-align: left; }
.tips { margin: 0; padding-inline-start: 18px; display: grid; gap: 6px; }
.notice { margin: 0; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; color: var(--muted); font-size: .85rem; text-align: center; }
.empty { margin: 0; color: var(--muted); text-align: center; padding: 12px; border: 1px dashed var(--line); border-radius: 6px; }
</style>
</head>
<body>
<script>document.documentElement.setAttribute("dir", "rtl"); document.documentElement.setAttribute("lang", "ar");</script>
<div class="wrap" dir="rtl" lang="ar">
  <div class="quote" aria-label="اقتباس">
    <p id="quoteText"></p>
  </div>
  <main>
    <section class="home" id="home">
      <div class="title">
        <div class="rule" aria-hidden="true"><i></i></div>
        <h1>ميزانيتي</h1>
        <div class="rule" aria-hidden="true"><i></i></div>
        <p class="ayah">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰ أَجَلٍ مُّسَمًّى فَاكْتُبُوهُ﴾<span>[البقرة: ٢٨٢]</span></p>
      </div>
      <div class="gate" id="gate"></div>
    </section>

    <section class="inside" id="view" hidden></section>
  </main>
</div>

<script>

  var LOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

  function svg(html) { var t = document.createElement("template"); t.innerHTML = html; return t.content.firstChild; }

  /* ---------- starting categories (amounts start at zero) ---------- */
  function items(prefix, names) { return names.map(function (n, i) { return { id: prefix + i, name: n, amount: 0 }; }); }
  var DEFAULTS = {

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميزان">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ميزان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* One page: month bar, summary, then collapsible panels (income, expenses, debts, savings, settings). Navy and gold, RTL, Western digits. */
:root {
  --bg: #0b1d3a; --bg-deep: #07142a; --panel: #10274b; --panel-2: #0d2142;
  --ink: #f2f5fa; --muted: #a9b6cc; --line: #24406b;
  --gold: #c9a55a; --gold-soft: rgba(201,165,90,.16);
  --ok: #5cc29a; --bad: #e58272;
  --font-display: "Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: radial-gradient(120% 70% at 50% 0%, var(--bg) 0%, var(--bg-deep) 100%) fixed, var(--bg-deep); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; direction: rtl; text-align: right; }
.wrap { max-width: 720px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px calc(env(safe-area-inset-bottom, 0px) + 28px); }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* top: title and month */
.top { display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.top h1 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; color: var(--gold); letter-spacing: .5px; }
.month { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
.month b { font-family: var(--font-display); font-weight: 600; font-size: .98rem; min-width: 8.5em; text-align: center; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); display: inline-grid; place-items: center; padding: 0; color: var(--gold); flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.now-btn { border: 1px solid var(--gold); background: transparent; color: var(--gold); border-radius: 999px; font-size: .75rem; padding: 2px 10px; }

/* summary */
.sum { background: linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis.two { grid-template-columns: repeat(2, 1fr); }
.kpi { background: rgba(0,0,0,.18); border-radius: 10px; padding: 8px 6px; text-align: center; min-width: 0; }
.kpi small { display: block; color: var(--muted); font-size: .76rem; line-height: 1.3; }
.kpi b { display: block; font-family: var(--font-display); font-size: .98rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.neg b, .neg { color: var(--bad); }
.kpi.pos b { color: var(--ok); }
.total-save { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--gold); background: var(--gold-soft); border-radius: 10px; padding: 8px 12px; }
.total-save span { font-family: var(--font-display); font-size: .88rem; color: var(--gold); }
.total-save b { font-family: var(--font-display); font-size: 1.12rem; }
.alert { border: 1px solid var(--bad); color: var(--bad); border-radius: 10px; padding: 6px 10px; font-size: .85rem; text-align: center; }
.alert.info { border-color: var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: right; }
.alert.info button { background: none; border: 0; color: inherit; font-size: 1.1rem; padding: 0 4px; }

/* panels */
.panels { display: grid; gap: 10px; margin-top: 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ph { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 12px 14px; text-align: right; }
.ph h2 { margin: 0; flex: 1; font-family: var(--font-display); font-size: 1rem; font-weight: 600; }
.ph .fig { font-family: var(--font-display); font-size: .92rem; color: var(--gold); }
.ph .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; flex: none; }
.panel.open .ph .chev { transform: rotate(-90deg); }
.pb { padding: 0 12px 12px; display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.sub { display: flex; justify-content: space-between; align-items: baseline; color: var(--gold); font-family: var(--font-display); font-size: .8rem; margin-top: 6px; }
.sub:first-child { margin-top: 0; }
.sub span { color: var(--muted); }

/* rows: name | amount | source | delete */
.row { display: grid; grid-template-columns: minmax(0,1fr) 7.2em auto 30px; gap: 6px; align-items: center; }
.row.nosrc { grid-template-columns: minmax(0,1fr) 7.2em 30px; }
.row input, .row select, .line input, .line select { min-width: 0; height: 38px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 0 8px; font-size: .92rem; }
.row input:focus, .row select:focus, .line input:focus, .line select:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
input.amt { text-align: left; direction: ltr; font-variant-numeric: tabular-nums; }
.row select { width: 5.8em; padding: 0 4px; font-size: .8rem; color: var(--muted); }
.row select.extra { color: var(--gold); }
.row select.saving { color: var(--ok); }
.del { width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 0; }
.del.arm { background: var(--bad); color: #fff; font-size: .62rem; font-family: var(--font-display); }
.meta { font-size: .78rem; color: var(--muted); margin: -2px 2px 4px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.meta input { height: 30px; width: 7em; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 0 6px; font-size: .82rem; }
.meta label { display: inline-flex; gap: 6px; align-items: center; }
.ro { display: flex; justify-content: space-between; font-size: .88rem; color: var(--muted); padding: 2px 4px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.add { border: 1px dashed var(--gold); background: transparent; color: var(--gold); border-radius: 8px; padding: 6px 12px; font-size: .85rem; }
.add.solid { border-style: solid; background: var(--gold); color: var(--bg-deep); font-family: var(--font-display); }
.line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .88rem; }
.hint { margin: 0; font-size: .8rem; color: var(--muted); }
.ok-msg { color: var(--ok); }
.err-msg { color: var(--bad); }
.empty { margin: 0; color: var(--muted); font-size: .85rem; text-align: center; padding: 6px; }
.tot { display: flex; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px; font-family: var(--font-display); font-size: .88rem; }
.ver { text-align: center; color: var(--muted); font-size: .72rem; margin-top: 14px; }

/* lock */
.lock { min-height: 80vh; display: grid; place-items: center; text-align: center; }
.lock form { display: grid; gap: 10px; width: min(280px, 100%); }
.lock h1 { margin: 0 0 8px; font-family: var(--font-display); color: var(--gold); font-size: 2rem; }
.lock input { height: 46px; text-align: center; font-size: 1.3rem; letter-spacing: 6px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; }
@media (min-width: 560px) { .row { grid-template-columns: minmax(0,1fr) 9em auto 30px; } .row.nosrc { grid-template-columns: minmax(0,1fr) 9em 30px; } }
</style>
</head>
<body>
<div class="wrap">
  <section id="lock" class="lock" hidden></section>
  <div id="app" hidden>
    <header class="top">
      <h1>ميزان</h1>
    </header>
    <div class="sum" id="sum"></div>
    <div class="month" id="month"></div>
    <div class="panels" id="panels"></div>
    <p class="ver" id="ver"></p>
  </div>
</div>
<script>
(function () {
  "use strict";
  var APP_VERSION = 71;
  var $ = function (id) { return document.getElementById(id); };
  var fmt = new Intl.NumberFormat("ar-SA-u-nu-latn", { maximumFractionDigits: 2 });
  var fmtAmt = new Intl.NumberFormat("ar-SA-u-nu-latn", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var fmtMonth = new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn", { month: "long", year: "numeric" });
  var money = function (n) { return fmtAmt.format(Math.round((n || 0) * 100) / 100); };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  function sum(arr, f) { return (arr || []).reduce(function (a, x) { var v = +f(x); return a + (isFinite(v) ? v : 0); }, 0); }
  var amt = function (x) { return x.amount; };

  /* every field shows English digits as you type, even from an Arabic keyboard */
  document.addEventListener("input", function (e) {
    var f = e.target;
    if (e.isComposing || !f || f.tagName !== "INPUT" || /^(date|checkbox|radio|file)$/.test(f.type)) return;
    var re = f.classList.contains("amt") ? /[٠-٩۰-۹٫٬]/g : /[٠-٩۰-۹]/g;
    if (!re.test(f.value)) return;
    var pos = f.selectionStart;
    f.value = f.value.replace(re, function (c) { return c === "٫" ? "." : c === "٬" ? "," : String("٠١٢٣٤٥٦٧٨٩".indexOf(c) + 1 ? "٠١٢٣٤٥٦٧٨٩".indexOf(c) : "۰۱۲۳۴۵۶۷۸۹".indexOf(c)); });
    try { if (pos != null) f.setSelectionRange(pos, pos); } catch (x) {}
  }, true);
  /* the last separator followed by one or two digits is the halala point; every other separator groups thousands */
  function parseAmount(v) {
    var s = String(v == null ? "" : v).replace(/\s+/g, "");
    var m = s.match(/^(.*\d)\D+(\d{1,2})$/);
    s = m ? m[1].replace(/\D/g, "") + "." + m[2] : s.replace(/\D/g, "");
    var n = parseFloat(s);
    return isFinite(n) ? Math.round(n * 100) / 100 : 0;
  }
  function el(tag, props) {
    var n = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "value") n.value = v;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    (function add(c) {
      if (c == null || c === false) return;
      if (Array.isArray(c)) c.forEach(add); else n.append(c);
    })([].slice.call(arguments, 2));
    return n;
  }
  function svg(html) { var t = document.createElement("template"); t.innerHTML = html; return t.content.firstChild; }
  var I_NEXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  var I_PREV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

  /* ---------- storage: same keys as every earlier version, on this device only ---------- */
  var LS = "mizaniyati:";
  function lsGet(path) { try { var v = localStorage.getItem(LS + path); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(path, v) { try { localStorage.setItem(LS + path, JSON.stringify(v)); } catch (e) {} }
  var DEFAULTS = {
    estimates: { fixed: [], variable: [] },
    debts: { list: [], owed: [] },
    savings: { items: [{ id: "s1", name: "الأمانة" }] },
    sections: { names: {}, hidden: {}, custom: [] },
    charity: { income: [], spend: [] }
  };
  var SETTINGS = ["estimates", "debts", "savings", "sections", "charity"];
  function emptyMonth() { return { income: [{ id: "i1", name: "الراتب", amount: 0 }, { id: "i2", name: "دخل إضافي", amount: 0 }], actual: {}, unscheduled: [], savingDeposit: 0 }; }
  function realMonth() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
  function addMonths(key, n) { var p = key.split("-").map(Number), d = new Date(p[0], p[1] - 1 + n, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
  function monthDiff(a, b) { var x = a.split("-").map(Number), y = b.split("-").map(Number); return (y[0] - x[0]) * 12 + (y[1] - x[1]); }
  var S = { month: realMonth(), months: {}, security: { hash: "", salt: "" } };
  SETTINGS.forEach(function (k) { S[k] = Object.assign(clone(DEFAULTS[k]), lsGet("settings/" + k) || {}); });
  S.security = lsGet("settings/security") || S.security;
  /* the month the budget starts: nothing before it counts (income, expenses, installments, الأمانة) */
  var START = ((lsGet("settings/start") || {}).month) || "";
  if (START && S.month < START) S.month = START;
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf(LS + "months/") === 0) { var mk = k.slice(LS.length + 7); if (/^\d{4}-\d{2}$/.test(mk)) S.months[mk] = Object.assign(emptyMonth(), lsGet("months/" + mk) || {}); } } } catch (e) {}
  function monthDoc(key) { key = key || S.month; if (!S.months[key]) S.months[key] = emptyMonth(); var m = S.months[key]; if (!m.actual) m.actual = {}; if (!m.unscheduled) m.unscheduled = []; if (!m.income) m.income = []; return m; }
  function dataFor(path) { return path.indexOf("months/") === 0 ? monthDoc(path.slice(7)) : S[path.slice(9)]; }
  var pending = {}, timers = {};
  function save(path) { pending[path] = true; clearTimeout(timers[path]); timers[path] = setTimeout(function () { flush(path); }, 400); }
  function flush(path) { lsSet(path, clone(dataFor(path))); pending[path] = false; }
  function flushAll() { Object.keys(pending).forEach(function (p) { if (pending[p]) { clearTimeout(timers[p]); flush(p); } }); }
  window.addEventListener("pagehide", flushAll);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flushAll(); });
  function mpath() { return "months/" + S.month; }

  /* older data kept scheduled expenses in two lists */
  if ((S.estimates.variable || []).length) { S.estimates.fixed = (S.estimates.fixed || []).concat(S.estimates.variable); S.estimates.variable = []; save("settings/estimates"); }
  /* each new month takes one installment off what is left of every debt */
  (function rollDebts() {
    var nowKey = realMonth(), changed = false;
    (S.debts.list || []).forEach(function (d) {
      if (!d.asOf) { d.asOf = nowKey; changed = true; return; }
      var n = monthDiff(d.asOf, nowKey);
      if (n > 0) {
        if (+d.installment > 0 && +d.remaining > 0) d.remaining = Math.max(Math.round((+d.remaining - d.installment * n) * 100) / 100, 0);
        d.asOf = nowKey; changed = true;
      }
    });
    if (changed) save("settings/debts");
  })();

  /* ---------- calculations (same rules as before) ---------- */
  /* expense sections added in earlier versions still count, unless they were removed */
  function customSecs() { var h = S.sections.hidden || {}; return (S.sections.custom || []).filter(function (c) { return !h[c.id] && !(c.parent === "actual" && h.actual); }); }
  function schedOn() { return !(S.sections.hidden || {}).actual; }
  function unschedOn() { return !(S.sections.hidden || {}).unscheduled; }
  function schedLists() {
    var out = [];
    if (schedOn()) out.push({ name: "", items: S.estimates.fixed, path: "settings/estimates" });
    customSecs().forEach(function (c) { c.items = c.items || []; out.push({ name: c.name || "قسم", items: c.items, path: "settings/sections" }); });
    return out;
  }
  /* «الادخار» is called «الأمانة» from v68; the default item's old name follows */
  (S.savings.items || []).forEach(function (it) { if (it.id === "s1" && it.name === "الادخار الشهري") { it.name = "الأمانة"; save("settings/savings"); } });
  function saveItems() { if (!S.savings.items) S.savings.items = clone(DEFAULTS.savings.items); return S.savings.items; }
  function savedManual(m, id) { return m.saved && id in m.saved ? +m.saved[id] || 0 : id === "s1" ? +m.savingDeposit || 0 : 0; }
  function setSaved(m, id, v) { if (!m.saved) { m.saved = { s1: +m.savingDeposit || 0 }; m.savingDeposit = 0; } m.saved[id] = v; }
  function autoOn() { return S.savings.auto !== false; }
  function autoItemId() { var items = saveItems(); return items.some(function (x) { return x.id === S.savings.autoTo; }) ? S.savings.autoTo : items[0] && items[0].id; }
  /* an expense is paid from the salary, the extra income (stored as "pension") or savings; anything else counts as salary */
  function srcOf(it) { return it.src === "pension" || it.src === "saving" ? it.src : "salary"; }
  function incomeSrc(it) { return it.src || (/راتب/.test(it.name || "") ? "salary" : "pension"); }
  function eachExpense(m, f) {
    schedLists().forEach(function (l) { l.items.forEach(function (it) { f(it, +m.actual[it.id] || 0); }); });
    if (unschedOn()) m.unscheduled.forEach(function (it) { f(it, +it.amount || 0); });
  }
  function expWithdrawals(m) {
    var out = [];
    eachExpense(m, function (it, v) { if (it.src === "saving" && v) out.push({ id: it.id, name: it.name || it.category || "مصروف", from: it.saveFrom || "", amount: v, auto: true }); });
    return out;
  }
  function allWithdrawals(m) { return (m.withdrawals || []).concat(expWithdrawals(m)); }
  var memo = {};
  function totals(key) {
    key = key || S.month;
    if (memo[key]) return memo[key];
    if (START && key < START) return (memo[key] = { income: 0, exp: 0, debts: 0, fromSave: 0, manual: 0, by: { salary: 0, pension: 0, saving: 0 }, inc: { salary: 0, pension: 0 }, left: { salary: 0, pension: 0 }, spent: 0, auto: 0, saving: 0, over: 0 });
    var m = monthDoc(key), by = { salary: 0, pension: 0, saving: 0 };
    eachExpense(m, function (it, v) { by[srcOf(it)] += v; });
    var debtBy = { salary: 0, pension: 0 };
    (S.debts.list || []).forEach(function (d) { if ((+d.remaining || 0) > 0) debtBy[d.src === "pension" ? "pension" : "salary"] += +d.installment || 0; });
    var t = { income: sum(m.income, amt), exp: by.salary + by.pension + by.saving, debts: debtBy.salary + debtBy.pension, fromSave: by.saving,
      manual: sum(saveItems(), function (it) { return savedManual(m, it.id); }) };
    t.inc = { salary: sum(m.income.filter(function (x) { return incomeSrc(x) === "salary"; }), amt), pension: sum(m.income.filter(function (x) { return incomeSrc(x) !== "salary"; }), amt) };
    t.left = { salary: t.inc.salary - by.salary - debtBy.salary, pension: t.inc.pension - by.pension - debtBy.pension };
    t.by = by;
    t.spent = t.exp + t.debts;
    /* what is left of the salary and extra income after expenses, installments and typed deposits goes to savings automatically */
    t.auto = autoOn() && saveItems().length ? Math.max(t.income - (t.spent - t.fromSave) - t.manual, 0) : 0;
    t.saving = t.manual + t.auto;
    t.over = Math.max((t.spent - t.fromSave) - t.income, 0);
    return (memo[key] = t);
  }
  function savedOf(key, id) { return savedManual(monthDoc(key), id) + (autoOn() && id === autoItemId() ? totals(key).auto : 0); }
  function storedKeys() { return Object.keys(S.months).filter(function (k) { return /^\d{4}-\d{2}$/.test(k) && !(START && k < START); }); }
  function saveBalance(id) {
    var it = saveItems().filter(function (x) { return x.id === id; })[0];
    return (+(it && it.base) || 0) + sum(storedKeys(), function (k) { return savedOf(k, id) - sum(allWithdrawals(S.months[k]).filter(function (w) { return w.from === id; }), amt); });
  }
  function saveTotal() {
    var list = saveItems(), keys = storedKeys();
    var p = { base: sum(list, function (it) { return +it.base || 0; }), manual: sum(keys, function (k) { return totals(k).manual; }),
      auto: autoOn() && list.length ? sum(keys, function (k) { return totals(k).auto; }) : 0, out: sum(keys, function (k) { return sum(allWithdrawals(S.months[k]), amt); }) };
    p.bal = p.base + p.manual + p.auto - p.out;
    return p;
  }

  /* ---------- PIN (optional privacy screen; set from «الإعدادات») ---------- */
  function normPin(v) { return String(v || "").replace(/\D/g, ""); }
  async function hashPin(pin, salt) {
    try {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pin));
      return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    } catch (e) { var h = 5381, str = salt + ":" + pin; for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return "d" + (h >>> 0).toString(16); }

        el("div", { class: "acts" }, el("button", { class: "add", type: "button", text: "+ سحب", onclick: function () { var n = { id: uid(), name: "", from: items[0] ? items[0].id : "", amount: 0 }; m.withdrawals.push(n); save(path); render(); focusRow(n.id); } }))
      ];
    });
  }

  /* fill only empty amounts from last month */
  var copyNote = {};
  function copyPrev(what) {
    var note = copyNote[what]; copyNote[what] = "";
    return [el("button", { class: "add", type: "button", text: "نسخ من الشهر السابق", onclick: function () {
      var pm = S.months[addMonths(S.month, -1)], m = monthDoc(), n = 0;
      if (pm && what === "income") {
        (pm.income || []).forEach(function (it) {
          var cur = m.income.filter(function (x) { return x.name === it.name; })[0];
          if (!cur) { if (+it.amount) { m.income.push({ id: uid(), name: it.name, amount: it.amount, src: it.src }); n++; } }
          else if (!+cur.amount && +it.amount) { cur.amount = it.amount; n++; }
        });
      } else if (pm) {
        schedLists().forEach(function (l) { l.items.forEach(function (it) { var v = +((pm.actual || {})[it.id] || 0); if (v && !+(m.actual[it.id] || 0)) { m.actual[it.id] = v; n++; } }); });
      }
      if (n) save(mpath());
      copyNote[what] = n ? "نُسخ " + fmt.format(n) + " من المبالغ." : pm ? "لا جديد للنسخ؛ الخانات الممتلئة لا تتغير." : "لا توجد بيانات في الشهر السابق.";
      render();
    } }), note ? el("span", { class: "hint ok-msg", text: note }) : null];
  }
  function focusRow(id) { setTimeout(function () { var f = document.querySelector('.row[data-id="' + id + '"] input'); if (f) { f.focus(); f.scrollIntoView({ block: "center" }); } }, 30); }

  /* ---------- settings: backup and PIN ---------- */
  function allData() {
    var data = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf(LS) === 0 && k !== LS + "unlocked") data[k.slice(LS.length)] = JSON.parse(localStorage.getItem(k)); } } catch (e) {}
    return data;
  }
  function backupDue() {
    if (!storedKeys().length) return "";
    var d = new Date(), since = new Date(d.getFullYear(), d.getMonth(), d.getDate() >= 15 ? 15 : 1).getTime();
    var last = lsGet("lastBackup"), closed = lsGet("backupReminderClosed");
    if ((last && new Date(last).getTime() >= since) || (closed && closed >= since)) return "";
    return "حان موعد النسخة الاحتياطية. صدّرها من «الإعدادات».";
  }
  var setMsg = { text: "", cls: "" }, pendingImport = null, pinOpen = false, startKey = "", startMove = true, startArm = false, startZero = true;
  function monthLabel(k) { var p = k.split("-").map(Number); return fmtMonth.format(new Date(p[0], p[1] - 1, 1)); }
  /* carry one month into another: empty amounts are filled, lists are added, nothing already there is overwritten */
  function moveMonth(from, to) {
    var a = S.months[from], b = monthDoc(to), n = 0; if (!a) return 0;
    (a.income || []).forEach(function (it) {
      var cur = b.income.filter(function (x) { return x.name === it.name; })[0];
      if (!cur) { if (+it.amount) { b.income.push({ id: uid(), name: it.name, amount: it.amount, src: it.src }); n++; } }
      else if (!+cur.amount && +it.amount) { cur.amount = it.amount; if (it.src) cur.src = it.src; n++; }
    });
    Object.keys(a.actual || {}).forEach(function (id) { if (+a.actual[id] && !+(b.actual[id] || 0)) { b.actual[id] = a.actual[id]; n++; } });
    (a.unscheduled || []).forEach(function (it) { if (+it.amount) { b.unscheduled.push(Object.assign({}, it, { id: uid() })); n++; } });
    saveItems().forEach(function (it) { var v = savedManual(a, it.id); if (v && !savedManual(b, it.id)) { setSaved(b, it.id, v); n++; } });
    (a.withdrawals || []).forEach(function (w) { if (+w.amount) { b.withdrawals = b.withdrawals || []; b.withdrawals.push(Object.assign({}, w, { id: uid() })); n++; } });
    flush("months/" + to);
    return n || 1;
  }
  function settingsPanel() {
    return panel("settings", "الإعدادات", null, function () {
      var msg = el("p", { class: "hint " + setMsg.cls, "aria-live": "polite", text: setMsg.text }); setMsg = { text: "", cls: "" };
      function say(t, c) { setMsg = { text: t, cls: c || "ok-msg" }; render(); }
      function exportFile() { say("تم إنشاء الملف «" + downloadBackup() + "». احفظه خارج الجهاز (iCloud أو Google Drive)."); }
      function downloadBackup() {
        flushAll();
        var d = new Date(), name = "mizan-backup-" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + ".json";
        var blob = new Blob([JSON.stringify({ app: "mizan", version: 1, exported: d.toISOString(), data: allData() }, null, 1)], { type: "application/json" });
        var a = el("a", { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click(); a.remove();
        lsSet("lastBackup", d.toISOString());
        return name;
      }
      /* the budget starts at a chosen month: optionally carry the month before into it, then drop every earlier month */
      var startSel = startKey || START || S.month, prevKey = addMonths(startSel, -1), hasPrev = !!S.months[prevKey];
      var earlier = storedKeys().filter(function (k) { return k < startSel; });
      function applyStart() {
        var name = downloadBackup(), moved = 0;
        if (hasPrev && startMove) moved = moveMonth(prevKey, startSel);
        earlier.forEach(function (k) { delete S.months[k]; try { localStorage.removeItem(LS + "months/" + k); } catch (e) {} });
        var zeroed = 0;
        if (startZero) saveItems().forEach(function (it) { if (+it.base) { it.base = 0; zeroed++; } });
        if (zeroed) flush("settings/savings");
        var ch = 0;
        ["income", "spend"].forEach(function (k) { var arr = S.charity[k] || []; for (var i = arr.length - 1; i >= 0; i--) if (arr[i].date && arr[i].date.slice(0, 7) < startSel) { arr.splice(i, 1); ch++; } });
        if (ch) flush("settings/charity");
        START = startSel; lsSet("settings/start", { month: START }); S.month = START;
        startArm = false; startKey = "";
        say("صارت بداية الميزانية والديون والأمانة والصندوق الخيري " + monthLabel(START) + (moved ? "، ونُقلت إليها بيانات " + monthLabel(prevKey) : "") + (earlier.length ? "، وحُذف " + fmt.format(earlier.length) + " من الأشهر السابقة" : "") + (zeroed ? "، وصُفّرت المبالغ التأسيسية للأمانة" : "") + (ch ? "، وحُذف " + fmt.format(ch) + " من قيود الصندوق الخيري السابقة" : "") + ". حُفظت نسخة احتياطية قبل التغيير: «" + name + "».");
      }
      var monthOpts = Object.keys(S.months).filter(function (k) { return /^\d{4}-\d{2}$/.test(k); }).concat([realMonth()]).filter(function (k, i, a) { return a.indexOf(k) === i; }).sort().map(function (k) { return [k, monthLabel(k)]; });
      var startBox = el("div", { class: "pb-block" },
        el("div", { class: "sub" }, "بداية الميزانية"),
        el("div", { class: "line" }, "تبدأ ميزانيتي من",
          selectEl(monthOpts, startSel, function (v) { startKey = v; startArm = false; render(); }, "شهر البداية")),
        hasPrev ? el("label", { class: "line" }, el("input", { type: "checkbox", checked: startMove ? true : null, style: "width:18px;height:18px", onchange: function (e) { startMove = e.target.checked; } }),
          "انقل بيانات " + monthLabel(prevKey) + " إلى " + monthLabel(startSel)) : null,
        saveItems().some(function (it) { return +it.base; }) ? el("label", { class: "line" }, el("input", { type: "checkbox", checked: startZero ? true : null, style: "width:18px;height:18px", onchange: function (e) { startZero = e.target.checked; } }),
          "صفّر المبالغ التأسيسية للأمانة (" + money(sum(saveItems(), function (it) { return +it.base || 0; })) + ")") : null,
        START === startSel && !earlier.length ? el("p", { class: "hint ok-msg", text: "الميزانية تبدأ من " + monthLabel(START) + "." }) : el("div", { class: "line" },
          el("button", { class: "add", type: "button", style: startArm ? "border-color:var(--bad);color:var(--bad)" : null, text: startArm ? (earlier.length ? "تأكيد: احذف " + fmt.format(earlier.length) + " من الأشهر قبل " + monthLabel(startSel) : "تأكيد") : "تطبيق", onclick: function () { if (startArm) applyStart(); else { startArm = true; render(); } } }),
          startArm ? el("button", { class: "add", type: "button", text: "إلغاء", onclick: function () { startArm = false; render(); } }) : null),
        el("p", { class: "hint", text: "كل شيء يبدأ من هذا الشهر: الدخل والمصروفات وأقساط الديون والأمانة والصندوق الخيري. الأشهر وقيود الصندوق قبله تُحذف ولا تُحسب. الديون تبقى بمتبقيها الحالي، وأقساطها تُحسب من شهر البداية فقط. تُنزَّل نسخة احتياطية تلقائيًا قبل التطبيق." }));
      function pick(e) {
        var f = e.target.files && e.target.files[0]; if (!f) return;
        var r = new FileReader();
        r.onload = function () {
          try { var j = JSON.parse(r.result); if (!j || j.app !== "mizan" || typeof j.data !== "object") throw 0; pendingImport = j;
            say("سيحل محتوى الملف (بتاريخ " + String(j.exported || "").slice(0, 10) + ") محل كل بياناتك الحالية. اضغط «تأكيد الاستيراد».", "err-msg");
          } catch (x) { pendingImport = null; say("هذا الملف ليس نسخة احتياطية من ميزان.", "err-msg"); }
        };
        r.readAsText(f);
      }
      function doImport() {
        try {
          Object.keys(localStorage).filter(function (k) { return k.indexOf(LS) === 0; }).forEach(function (k) { localStorage.removeItem(k); });
          Object.keys(pendingImport.data).forEach(function (k) { localStorage.setItem(LS + k, JSON.stringify(pendingImport.data[k])); });
        } catch (e) { say("تعذر الاستيراد. تأكد من وجود مساحة كافية.", "err-msg"); return; }
        location.reload();
      }
      var last = lsGet("lastBackup");
      var pinBox = null;
      if (pinOpen) {
        var a = el("input", { type: "password", inputmode: "numeric", maxlength: "8", placeholder: "الرقم السري", "aria-label": "الرقم السري الجديد" });
        var b = el("input", { type: "password", inputmode: "numeric", maxlength: "8", placeholder: "تأكيده", "aria-label": "تأكيد الرقم السري" });
        pinBox = el("div", { class: "line" }, a, b, el("button", { class: "add solid", type: "button", text: "حفظ", onclick: async function () {
          var x = normPin(a.value), y = normPin(b.value);
          if (!/^\d{4,8}$/.test(x)) { say("الرقم السري من 4 إلى 8 أرقام.", "err-msg"); pinOpen = true; return; }
          if (x !== y) { say("الرقمان غير متطابقين.", "err-msg"); return; }
          var salt = uid() + uid(); S.security = { salt: salt, hash: await hashPin(x, salt), v: 2 }; flush("settings/security"); setUnlocked(true);
          pinOpen = false; say("تم حفظ الرقم السري، وسيُطلب عند كل تشغيل.");
        } }));
      }
      return [
        el("div", { class: "line" },
          el("button", { class: "add solid", type: "button", text: "تصدير نسخة احتياطية", onclick: exportFile }),
          el("label", { class: "add", for: "importFile", text: "استيراد" }),
          el("input", { id: "importFile", type: "file", accept: ".json,application/json", hidden: true, onchange: pick }),
          pendingImport ? el("button", { class: "add", type: "button", style: "border-color:var(--bad);color:var(--bad)", text: "تأكيد الاستيراد", onclick: doImport }) : null),
        el("p", { class: "hint", text: (last ? "آخر نسخة: " + new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn", { dateStyle: "long" }).format(new Date(last)) + ". " : "") + "بياناتك في هذا الجهاز فقط؛ صدّر نسخة كل شهر." }),
        el("div", { class: "line" },
          el("button", { class: "add", type: "button", text: pinSet() ? "تغيير الرقم السري" : "تسجيل رقم سري", onclick: function () { pinOpen = !pinOpen; render(); } }),
          pinSet() ? el("button", { class: "add", type: "button", text: "إلغاء الرقم السري", onclick: function () { S.security = { hash: "", salt: "" }; flush("settings/security"); setUnlocked(false); say("أُلغي الرقم السري."); } }) : null,
          pinSet() ? el("button", { class: "add", type: "button", text: "قفل الآن", onclick: function () { setUnlocked(false); show(); } }) : null),
        pinBox, startBox, msg
      ];
    });
  }

  function render() {
    memo = {};
    var y = window.scrollY;
    $("month").replaceChildren.apply($("month"), monthBar().filter(Boolean));
    $("sum").replaceChildren.apply($("sum"), summary().filter(Boolean));
    $("panels").replaceChildren(incomePanel(), expensesPanel("salary"), expensesPanel("pension"), debtsPanel(), savingsPanel(), charityPanel(), settingsPanel());
    $("ver").textContent = "الإصدار " + APP_VERSION;
    refresh();
    window.scrollTo(0, y);
  }

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  /* look for a new version on every open, and reload once it has taken over */
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    try {
      var hadController = !!navigator.serviceWorker.controller, reloaded = false;
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (reg) {
        document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") reg.update().catch(function () {}); });
      }).catch(function () {});
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        var a = document.activeElement;
        if (!hadController || reloaded || (a && a.tagName === "INPUT")) { hadController = true; return; }
        reloaded = true; flushAll(); location.reload();
      });
    } catch (e) {}
  }
  show();
})();
</script>
</body>
</html>
